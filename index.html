<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PATHAN BRAND.</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 15px; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #000; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .admin-btn { position: fixed; bottom: 20px; right: 20px; width: auto; background: #444; }
        .product-img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; margin-top: 10px; }
        .delete-btn { background: red; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="loginSection" class="card">
        <h3>Login to Pathan Brand</h3>
        <input type="text" id="mobileInput" placeholder="03XXXXXXXXX" maxlength="11">
        <button onclick="loginUser()">Login</button>
    </div>

    <div id="adminPanel" class="card" style="display:none;">
        <h3>🔑 CEO OFFICE</h3>
        <input type="text" id="pName" placeholder="Product Name">
        <input type="number" id="pPrice" placeholder="Price">
        <input type="file" id="pImages" accept="image/*">
        <button onclick="saveProduct()" style="background: green;">Add Product</button>
        <hr style="margin: 20px 0;">
        <button class="delete-btn" onclick="clearAllProducts()">Delete All Products</button>
    </div>

    <div id="product-container"></div>

    <button class="admin-btn" onclick="checkAdmin()">Admin Panel</button>

    <script>
        window.onload = function() {
            if(localStorage.getItem("userLoggedIn") === "true") {
                document.getElementById("loginSection").style.display = "none";
                displayProducts();
            }
            if(localStorage.getItem("isAdmin") === "true") {
                document.getElementById("adminPanel").style.display = "block";
            }
        };

        function loginUser() {
            let m = document.getElementById("mobileInput").value;
            if(/^03\d{9}$/.test(m)) {
                localStorage.setItem("userLoggedIn", "true");
                location.reload();
            } else { alert("Sahi Pakistani number likhein!"); }
        }

        function checkAdmin() {
            if(localStorage.getItem("userLoggedIn") !== "true") return alert("Pehle Login karein!");
            let pass = prompt("Enter CEO Password:");
            if(pass === "p@th@nk1ng") {
                localStorage.setItem("isAdmin", "true");
                location.reload();
            } else { alert("Wrong Password!"); }
        }

        function saveProduct() {
            let name = document.getElementById("pName").value;
            let price = document.getElementById("pPrice").value;
            let fileInput = document.getElementById("pImages");
            
            if(!name || !price || fileInput.files.length === 0) return alert("Sab fields fill karein!");

            let reader = new FileReader();
            reader.onload = function(e) {
                let products = JSON.parse(localStorage.getItem("products") || "[]");
                products.push({ name, price, img: e.target.result });
                localStorage.setItem("products", JSON.stringify(products));
                location.reload();
            };
            reader.readAsDataURL(fileInput.files[0]);
        }

        function clearAllProducts() {
            if(confirm("Saare products delete kar dein?")) {
                localStorage.removeItem("products");
                location.reload();
            }
        }

        function displayProducts() {
            let products = JSON.parse(localStorage.getItem("products") || "[]");
            let container = document.getElementById("product-container");
            container.innerHTML = "";
            products.forEach(p => {
                container.innerHTML += `
                    <div class="card">
                        <h3>${p.name}</h3>
                        <p>Price: Rs. ${p.price}</p>
                        <img src="${p.img}" class="product-img">
                    </div>`;
            });
        }
    </script>
</body>
</html>
