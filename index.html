<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PATHAN BRAND.</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 10px; }
        .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        /* Product Slider */
        .img-container { position: relative; }
        .product-img { width: 100%; height: 300px; object-fit: cover; border-radius: 10px; }
        .slider-btn { position: absolute; top: 50%; width: auto; background: rgba(0,0,0,0.5); padding: 10px; }
        
        /* Admin Panel Hidden */
        #adminPanel { display: none; border: 2px dashed #2563eb; padding: 15px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div id="loginSection" class="card">
        <h3>Welcome to Pathan Brand</h3>
        <input type="text" id="mobileInput" placeholder="Enter Mobile Number (03XXXXXXXXX)" maxlength="11">
        <button onclick="loginUser()">Verify & Login</button>
    </div>

    <div id="adminPanel" class="card">
        <h3 style="color: #2563eb;">CEO OFFICE - Add New Product</h3>
        <input type="text" id="pName" placeholder="Product Name">
        <input type="number" id="pPrice" placeholder="Price">
        <input type="file" id="pImages" multiple accept="image/*">
        <button onclick="saveProduct()" style="background: #059669;">Upload Product</button>
        <button onclick="clearProducts()" style="background: #dc2626; margin-top: 10px;">Delete All Data</button>
    </div>

    <div id="product-container"></div>

    <button id="adminTrigger" onclick="checkAdmin()" style="position:fixed; bottom:20px; right:20px; width:auto; background: #333;">🔑 Admin Panel</button>

    <script>
        let products = JSON.parse(localStorage.getItem("products") || "[]");

        function loginUser() {
            let m = document.getElementById("mobileInput").value;
            if(/^03\d{9}$/.test(m)) {
                localStorage.setItem("userLoggedIn", "true");
                location.reload();
            } else { alert("Please enter a valid Pakistani number (03...)"); }
        }

        function checkAdmin() {
            let pass = prompt("Enter CEO Password:");
            if(pass === "p@th@nk1ng") {
                localStorage.setItem("isAdmin", "true");
                location.reload();
            } else { alert("Access Denied!"); }
        }

        function saveProduct() {
            let files = document.getElementById("pImages").files;
            if(files.length === 0) return alert("Select at least one image!");
            
            let readerPromises = Array.from(files).map(file => new Promise(res => {
                let reader = new FileReader();
                reader.onload = e => res(e.target.result);
                reader.readAsDataURL(file);
            }));

            Promise.all(readerPromises).then(images => {
                products.push({ name: document.getElementById("pName").value, price: document.getElementById("pPrice").value, images, idx: 0 });
                localStorage.setItem("products", JSON.stringify(products));
                location.reload();
            });
        }

        function nextImg(pIdx) {
            products[pIdx].idx = (products[pIdx].idx + 1) % products[pIdx].images.length;
            localStorage.setItem("products", JSON.stringify(products));
            displayProducts();
        }

        function clearProducts() {
            if(confirm("Confirm Delete All?")) { localStorage.removeItem("products"); location.reload(); }
        }

        function displayProducts() {
            let container = document.getElementById("product-container");
            container.innerHTML = "";
            products.forEach((p, i) => {
                container.innerHTML += `
                    <div class="card">
                        <div class="img-container">
                            <img src="${p.images[p.idx]}" class="product-img">
                            <button class="slider-btn" style="right:0;" onclick="nextImg(${i})">Next ▶</button>
                        </div>
                        <h3>${p.name}</h3>
                        <p style="color: green; font-weight: bold;">Price: Rs. ${p.price}</p>
                    </div>`;
            });
        }

        // INIT
        if(localStorage.getItem("userLoggedIn") === "true") {
            document.getElementById("loginSection").style.display = "none";
            if(localStorage.getItem("isAdmin") === "true") document.getElementById("adminPanel").style.display = "block";
            displayProducts();
        }
    </script>
</body>
</html>
