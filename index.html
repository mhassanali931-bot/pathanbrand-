<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PATHAN BRAND</title>
    <style>
        body { font-family: sans-serif; background: #000; color: #d4af37; margin: 0; padding: 10px; }
        .card { background: #1a1a1a; padding: 15px; border-radius: 15px; margin-bottom: 15px; border: 1px solid #d4af37; }
        input, select { width: 100%; padding: 12px; background: #000; color: #fff; border: 1px solid #d4af37; border-radius: 8px; box-sizing: border-box; margin-bottom: 10px; }
        button { width: 100%; padding: 12px; background: #d4af37; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .product-img { width: 100%; height: 250px; object-fit: cover; border-radius: 10px; }
        #adminPanel { display: none; border: 1px solid #d4af37; padding: 15px; margin-bottom: 20px; background: #1a1a1a; }
        .header { text-align: center; color: #d4af37; font-size: 24px; font-weight: bold; margin: 20px 0; }
    </style>
</head>
<body>

    <div class="header">PATHAN BRAND</div>

    <!-- LOGIN -->
    <div id="loginSection" class="card">
        <h3>Login / Register</h3>
        <input type="text" id="mobileInput" placeholder="Enter mobile number" maxlength="11">
        <button onclick="loginUser()">LOGIN</button>
    </div>

    <!-- ADMIN PANEL -->
    <div id="adminPanel" class="card">
        <h3 style="color:#d4af37;">CEO OFFICE - Add Product</h3>
        <select id="pCat">
            <option>Clothing</option>
            <option>Cosmetics</option>
            <option>Home & Kitchen</option>
        </select>
        <input type="text" id="pName" placeholder="Product Name">
        <input type="number" id="pPrice" placeholder="Price">
        <input type="file" id="pImages" multiple accept="image/*">
        <button onclick="saveProduct()">Upload Product</button>
    </div>

    <div id="product-container"></div>

    <button onclick="checkAdmin()" style="position:fixed; bottom:10px; right:10px; width:auto;">Admin Access</button>

    <script>
        let products = JSON.parse(localStorage.getItem("products") || "[]");

        function loginUser() {
            if(/^03\d{9}$/.test(document.getElementById("mobileInput").value)) {
                localStorage.setItem("userLoggedIn", "true");
                location.reload();
            } else { alert("Enter valid number (03...)"); }
        }

        function checkAdmin() {
            if(prompt("Enter CEO Password:") === "p@th@nk1ng") {
                localStorage.setItem("isAdmin", "true");
                location.reload();
            }
        }

        async function saveProduct() {
            let files = document.getElementById("pImages").files;
            let images = [];
            for(let f of files) {
                images.push(await new Promise(r => { let reader = new FileReader(); reader.onload = e => r(e.target.result); reader.readAsDataURL(f); }));
            }
            products.push({ cat: document.getElementById("pCat").value, name: document.getElementById("pName").value, price: document.getElementById("pPrice").value, images, idx: 0 });
            localStorage.setItem("products", JSON.stringify(products));
            location.reload();
        }

        function nextImg(pIdx) {
            products[pIdx].idx = (products[pIdx].idx + 1) % products[pIdx].images.length;
            displayProducts();
        }

        function displayProducts() {
            let container = document.getElementById("product-container");
            container.innerHTML = "";
            products.forEach((p, i) => {
                container.innerHTML += `
                    <div class="card">
                        <small style="color: #d4af37;">${p.cat}</small>
                        <img src="${p.images[p.idx]}" class="product-img" onclick="window.open(this.src)">
                        <h3>${p.name}</h3>
                        <p>PKR ${p.price}</p>
                        <button onclick="nextImg(${i})">Next Image (${p.idx + 1}/${p.images.length})</button>
                        <a href="https://wa.me/923000000000?text=I want to buy ${p.name}" style="display:block; margin-top:10px; color:#d4af37; text-align:center;">Order on WhatsApp</a>
                    </div>`;
            });
        }

        if(localStorage.getItem("userLoggedIn") === "true") {
            document.getElementById("loginSection").style.display = "none";
            if(localStorage.getItem("isAdmin") === "true") document.getElementById("adminPanel").style.display = "block";
            displayProducts();
        }
    </script>
</body>
</html>
