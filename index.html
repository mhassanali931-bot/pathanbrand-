<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PATHAN BRAND.</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 10px; margin-bottom: 70px; }
        .card { background: white; padding: 15px; margin-bottom: 10px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input { width: 90%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; cursor: pointer; background: black; color: white; border: none; border-radius: 5px; }
        .product-img { width: 100%; height: 200px; object-fit: cover; }
    </style>
</head>
<body>

    <div id="authScreen" class="card">
        <h3>Login with Code</h3>
        <p>Aapka Secret Code: <b>5249</b></p>
        <input type="number" id="otpInput" placeholder="Enter Code: 5249">
        <button onclick="verifyOTP()">Login</button>
    </div>

    <div id="adminPanel" class="card" style="display:none;">
        <h3>CEO OFFICE - Add Product</h3>
        <input type="text" id="pName" placeholder="Product Name">
        <input type="number" id="pPrice" placeholder="Price">
        <input type="file" id="pImages" multiple accept="image/*">
        <button onclick="saveProduct()">Save Product</button>
    </div>

    <div id="product-container"></div>
    <button onclick="checkAdmin()" style="position:fixed; bottom:10px; right:10px;">🔑 Admin</button>

    <script>
        // Database
        let products = JSON.parse(localStorage.getItem("products")) || [];

        // Verify OTP
        function verifyOTP() {
            if(document.getElementById("otpInput").value == "5249") {
                localStorage.setItem("loggedIn", "true");
                location.reload();
            } else { alert("Galat Code!"); }
        }

        // Admin Auth
        function checkAdmin() {
            let pass = prompt("Password:");
            if(pass == "p@th@nk1ng") {
                localStorage.setItem("isAdmin", "true");
                location.reload();
            }
        }

        // Save Product with multiple images
        function saveProduct() {
            let files = document.getElementById("pImages").files;
            let readerPromises = [];
            
            for(let file of files) {
                let reader = new FileReader();
                readerPromises.push(new Promise(res => {
                    reader.onload = e => res(e.target.result);
                    reader.readAsDataURL(file);
                }));
            }

            Promise.all(readerPromises).then(images => {
                let p = {
                    id: Date.now(),
                    name: document.getElementById("pName").value,
                    price: document.getElementById("pPrice").value,
                    images: images
                };
                products.push(p);
                localStorage.setItem("products", JSON.stringify(products));
                alert("Product Saved!");
                location.reload();
            });
        }

        // Display
        if(localStorage.getItem("loggedIn") == "true") {
            document.getElementById("authScreen").style.display = "none";
            products.forEach(p => {
                document.getElementById("product-container").innerHTML += `
                    <div class="card">
                        <img src="${p.images[0]}" class="product-img">
                        <h3>${p.name}</h3>
                        <p>Rs. ${p.price}</p>
                    </div>`;
            });
        }

        if(localStorage.getItem("isAdmin") == "true") {
            document.getElementById("adminPanel").style.display = "block";
        }
    </script>
</body>
</html>
