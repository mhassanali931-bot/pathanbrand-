<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PATHAN BRAND.</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 15px; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h3 { margin-top: 0; color: #333; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #000; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .admin-btn { position: fixed; bottom: 20px; right: 20px; width: auto; background: #444; }
        .product-img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="loginSection" class="card">
        <h3>Login to Pathan Brand</h3>
        <input type="text" id="mobileInput" placeholder="03XXXXXXXXX (11 digits)" maxlength="11">
        <button onclick="loginUser()">Login</button>
    </div>

    <div id="adminPanel" class="card" style="display:none;">
        <h3>CEO OFFICE - Add Product</h3>
        <input type="text" id="pName" placeholder="Product Name">
        <input type="number" id="pPrice" placeholder="Price">
        <input type="file" id="pImages" multiple accept="image/*">
        <button onclick="saveProduct()" style="background: green;">Save Product</button>
    </div>

    <div id="product-container"></div>

    <button class="admin-btn" onclick="checkAdmin()">🔑 Admin</button>

    <script>
        // 1. LOGIN LOGIC
        function loginUser() {
            let m = document.getElementById("mobileInput").value;
            if(/^03\d{9}$/.test(m)) {
                localStorage.setItem("userLoggedIn", "true");
                alert("Login Successful!");
                location.reload();
            } else {
                alert("Enter a valid Pakistani mobile number (starting with 03)");
            }
        }

        // 2. ADMIN ACCESS
        function checkAdmin() {
            let pass = prompt("Enter CEO Password:");
            if(pass === "p@th@nk1ng") {
                localStorage.setItem("isAdmin", "true");
                document.getElementById("adminPanel").style.display = "block";
            } else { alert("Wrong Password!"); }
        }

        // 3. SAVE PRODUCT
        function saveProduct() {
            let name = document.getElementById("pName").value;
            let price = document.getElementById("pPrice").value;
            let files = document.getElementById("pImages").files;
            
            if(!name || !price || files.length === 0) {
                alert("Sab details fill karein!");
                return;
            }

            // Image to Base64 (saving in local storage for demo)
            let reader = new FileReader();
            reader.onload = function(e) {
                let product = { name, price, img: e.target.result };
                let products = JSON.parse(localStorage.getItem("products") || "[]");
                products.push(product);
                localStorage.setItem("products", JSON.stringify(products));
                alert("Product Added!");
                location.reload();
            };
            reader.readAsDataURL(files[0]);
        }

        // 4. LOAD PRODUCTS
        if(localStorage.getItem("userLoggedIn") === "true") {
            document.getElementById("loginSection").style.display = "none";
            let products = JSON.parse(localStorage.getItem("products") || "[]");
            let container = document.getElementById("product-container");
            products.forEach(p => {
                container.innerHTML += `
                    <div class="card">
                        <h3>${p.name}</h3>
                        <p>Price: Rs. ${p.price}</p>
                        <img src="${p.img}" class="product-img">
                    </div>`;
            });
        }

        // Show Admin Panel if already logged in
        if(localStorage.getItem("isAdmin") === "true") {
            document.getElementById("adminPanel").style.display = "block";
        }
    </script>
</body>
</html>
