<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PATHAN BRAND.</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 15px; }
        .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: black; color: white; border: none; cursor: pointer; margin-top: 5px; }
        .product-img { width: 100%; height: 250px; object-fit: contain; background: #eee; }
        .nav-btn { background: #333; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="loginSection" class="card">
        <h3>Login</h3>
        <input type="text" id="mobileInput" placeholder="03XXXXXXXXX" maxlength="11">
        <button onclick="loginUser()">Login</button>
    </div>

    <div id="adminPanel" class="card" style="display:none;">
        <h3>🔑 CEO OFFICE</h3>
        <input type="text" id="pName" placeholder="Product Name">
        <input type="number" id="pPrice" placeholder="Price">
        <input type="file" id="pImages" multiple accept="image/*">
        <button onclick="saveProduct()" style="background: green;">Add Product</button>
        <button onclick="clearProducts()" style="background: red;">Delete All Products</button>
    </div>

    <div id="product-container"></div>
    <button onclick="checkAdmin()" style="position:fixed; bottom:10px; right:10px; width:auto;">Admin Access</button>

    <script>
        let products = JSON.parse(localStorage.getItem("products") || "[]");

        function loginUser() {
            if(/^03\d{9}$/.test(document.getElementById("mobileInput").value)) {
                localStorage.setItem("userLoggedIn", "true");
                location.reload();
            } else { alert("Invalid Pakistani Number!"); }
        }

        function checkAdmin() {
            let pass = prompt("Enter CEO Password:");
            if(pass === "p@th@nk1ng") {
                localStorage.setItem("isAdmin", "true");
                location.reload();
            } else { alert("Wrong Password!"); }
        }

        function saveProduct() {
            let files = document.getElementById("pImages").files;
            if(files.length === 0) return alert("Select images!");
            
            let readerPromises = Array.from(files).map(file => new Promise(res => {
                let reader = new FileReader();
                reader.onload = e => res(e.target.result);
                reader.readAsDataURL(file);
            }));

            Promise.all(readerPromises).then(images => {
                products.push({ name: document.getElementById("pName").value, price: document.getElementById("pPrice").value, images, idx: 0 });
                localStorage.setItem("products", JSON.stringify(products));
                location.reload();
            });
        }

        function nextImg(pIdx) {
            products[pIdx].idx = (products[pIdx].idx + 1) % products[pIdx].images.length;
            localStorage.setItem("products", JSON.stringify(products));
            location.reload();
        }

        function clearProducts() {
            if(confirm("Delete all?")) { localStorage.removeItem("products"); location.reload(); }
        }

        if(localStorage.getItem("userLoggedIn") === "true") {
            document.getElementById("loginSection").style.display = "none";
            if(localStorage.getItem("isAdmin") === "true") document.getElementById("adminPanel").style.display = "block";
            
            products.forEach((p, i) => {
                document.getElementById("product-container").innerHTML += `
                    <div class="card">
                        <img src="${p.images[p.idx]}" class="product-img" onclick="window.open('${p.images[p.idx]}')">
                        <h3>${p.name}</h3>
                        <p>Price: Rs. ${p.price}</p>
                        <button class="nav-btn" onclick="nextImg(${i})">Next Image (${p.idx + 1}/${p.images.length})</button>
                    </div>`;
            });
        }
    </script>
</body>
</html>
